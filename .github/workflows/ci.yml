# 质量门禁 CI：actionlint / gofmt / go vet / 全量测试 / race / 前后端供应链扫描。
# 集成测试需要 MySQL/Redis/RabbitMQ/MinIO——MySQL/RabbitMQ 用 services（仅 env/ports/options，合法键）；
# Redis 需 --databases 21（库 15-20 供集成测试按包隔离）、MinIO 需自定义启动命令，二者 GitHub Actions
# 服务容器不支持 command 键，故在 step 内 docker run 自管（见下方「启动 Redis 与 MinIO」步骤）。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  workflow-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: GitHub Actions 语法检查
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  lint-and-test:
    needs: workflow-lint
    runs-on: ubuntu-24.04
    env:
      GO_SINGLE_INTEGRATION_REQUIRED: "1"
      GO_SINGLE_MQ_URL: amqp://guest:guest@127.0.0.1:5672/ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      GO_SINGLE_MQ_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
    services:
      mysql:
        image: mysql:8.4.6@sha256:869218921e61d6c3c89820955d63cca42971f0e3e6c1e2792247bbd944ebc6e9
        env:
          MYSQL_ROOT_PASSWORD: root123
          MYSQL_DATABASE: go_shop
          MYSQL_USER: shop
          MYSQL_PASSWORD: shop123
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot123"
          --health-interval 5s --health-timeout 3s --health-retries 20
      rabbitmq:
        image: rabbitmq:3.13.7-management@sha256:e582c0bc7766f3342496d8485efb5a1df782b5ce3886ad017e2eaae442311f69
        env:
          RABBITMQ_DEFAULT_VHOST: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        ports: ["5672:5672", "15672:15672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s --health-timeout 3s --health-retries 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 启动 Redis 与 MinIO（服务容器不支持 command 键，改为 docker run 自管）
        run: |
          docker run -d --name redis -p 6379:6379 \
            --health-cmd "redis-cli ping" \
            --health-interval 5s --health-timeout 3s --health-retries 20 \
            redis:7.4.5-alpine@sha256:bb186d083732f669da90be8b0f975a37812b15e913465bb14d845db72a4e3e08 \
            redis-server --databases 21 --appendonly yes --appendfsync everysec
          docker run -d --name minio \
            -p 19000:9000 -p 19001:9001 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            --health-cmd "mc ready local" \
            --health-interval 5s --health-timeout 3s --health-retries 20 \
            minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e \
            server /data --console-address ":9001"
          ready=0
          for i in $(seq 1 30); do
            redis_status=$(docker inspect -f '{{.State.Health.Status}}' redis 2>/dev/null)
            minio_status=$(docker inspect -f '{{.State.Health.Status}}' minio 2>/dev/null)
            echo "等待依赖就绪（${i}/30）：redis=${redis_status:-启动中} minio=${minio_status:-启动中}"
            if [ "$redis_status" = "healthy" ] && [ "$minio_status" = "healthy" ]; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then
            echo "Redis/MinIO 未在时限内就绪，输出日志："
            docker logs redis 2>&1 | tail -20
            docker logs minio 2>&1 | tail -20
            exit 1
          fi

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: gofmt 检查（仓库标准：全量格式化）
        run: |
          unformatted=$(gofmt -l internal cmd)
          if [ -n "$unformatted" ]; then
            echo "未通过 gofmt："; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: 全量单元 + 集成测试（真实 MySQL/Redis/RabbitMQ/MinIO）
        run: go test ./... -count=1

      - name: race 检测（并发敏感业务包与生产装配）
        run: go test -race -count=1 ./cmd/server ./internal/user/... ./internal/platform/limiter/... ./internal/platform/requestbody/... ./internal/platform/file/... ./internal/flashsale/... ./internal/coupon/... ./internal/social/... ./internal/platform/ws/... ./internal/platform/mq/... ./internal/chat/... ./internal/order/... ./internal/payment/... ./internal/product/... ./internal/cart/...

      - name: 供应链漏洞扫描（govulncheck）
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

      - name: 安装前端依赖（冻结锁文件）
        run: |
          cd web/faire && bun install --frozen-lockfile
          cd ../../website && bun install --frozen-lockfile

      - name: 前端与部署契约测试
        run: |
          bun test scripts/*.test.ts
          cd web/faire && bun test scripts/*.test.ts

      - name: 前端依赖审计（精确允许列表）
        run: bun run scripts/frontend-audit.ts

      - name: website 类型检查
        working-directory: website
        run: bun run typecheck

      - name: 前端构建（web/faire + website）
        run: |
          cd web/faire && bun run build
          cd ../../website && bun run build

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: lint-and-test
    uses: ./.github/workflows/pages-deploy.yml
    secrets: inherit

# Cloudflare Pages 自动部署（T28 部署收尾·接线）：
#   web/faire（SPA 主题）与 website/（Docusaurus 文档站）各一个 Pages 项目，push main 自动构建部署，
#   也可 workflow_dispatch 手动触发。接线详见 docs/DEPLOYMENT.md。
#
# 所需仓库配置：
#   - Secrets:   CLOUDFLARE_API_TOKEN（Pages:Edit 权限）、CLOUDFLARE_ACCOUNT_ID
#   - Variables: VITE_API_BASE（后端 HTTPS 绝对地址）、VITE_WS_BASE（后端 WSS 绝对地址），两者必填
#   - 先建 Pages 项目：wrangler pages project create go-single-web-faire / go-single-website
name: Deploy Cloudflare Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "website/**"
      - ".github/workflows/pages-deploy.yml"

permissions:
  contents: read

jobs:
  deploy-web-faire:
    runs-on: ubuntu-24.04
    steps:
      - name: 校验 Cloudflare 后端变量
        env:
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
          VITE_WS_BASE: ${{ vars.VITE_WS_BASE }}
        run: |
          case "$VITE_API_BASE" in
            https://?*) ;;
            *) echo "VITE_API_BASE 必须是非空 HTTPS 绝对地址" >&2; exit 1 ;;
          esac
          case "$VITE_WS_BASE" in
            wss://?*) ;;
            *) echo "VITE_WS_BASE 必须是非空 WSS 绝对地址" >&2; exit 1 ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Build web/faire
        working-directory: web/faire
        env:
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
          VITE_WS_BASE: ${{ vars.VITE_WS_BASE }}
        run: bun install --frozen-lockfile && bun run build
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web/faire
          wranglerVersion: "4.123.0"
          command: pages deploy dist --project-name=go-single-web-faire --branch=main

  deploy-website:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Build website
        working-directory: website
        run: bun install --frozen-lockfile && bun run build
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: website
          wranglerVersion: "4.123.0"
          command: pages deploy build --project-name=go-single-website --branch=main

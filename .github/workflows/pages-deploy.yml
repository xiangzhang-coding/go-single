# Cloudflare Pages 自动部署（T28 部署收尾·接线）：
#   web/faire（SPA 主题）与 website/（Docusaurus 文档站）各一个 Pages 项目。
#   main 分支由 CI 通过后调用本工作流，也可 workflow_dispatch 手动触发。
#
# 所需仓库配置：
#   - Secrets:   CLOUDFLARE_API_TOKEN（Pages:Edit 权限）、CLOUDFLARE_ACCOUNT_ID
#   - Variables: VITE_API_BASE（后端 HTTPS 绝对地址）、VITE_WS_BASE（后端 WSS 绝对地址），两者必填
#   - 先建 Pages 项目：wrangler pages project create go-single-web-faire / go-single-website
name: Deploy Cloudflare Pages

on:
  workflow_call:
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configuration:
    runs-on: ubuntu-24.04
    outputs:
      cloudflare_configured: ${{ steps.check.outputs.cloudflare_configured }}
      web_configured: ${{ steps.check.outputs.web_configured }}
    steps:
      - id: check
        name: 检查 Pages 仓库配置
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
          VITE_WS_BASE: ${{ vars.VITE_WS_BASE }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "cloudflare_configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "cloudflare_configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::未配置 Cloudflare Secrets，跳过 Pages 发布"
          fi
          if [ -n "$VITE_API_BASE" ] && [ -n "$VITE_WS_BASE" ]; then
            echo "web_configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "web_configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::未配置 VITE_API_BASE/VITE_WS_BASE，跳过 Faire 发布"
          fi

  deploy-web-faire:
    needs: configuration
    if: needs.configuration.outputs.cloudflare_configured == 'true' && needs.configuration.outputs.web_configured == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: 校验 Cloudflare 后端变量
        env:
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
          VITE_WS_BASE: ${{ vars.VITE_WS_BASE }}
        run: bun run scripts/validate-pages-env.ts
      - name: Build web/faire
        working-directory: web/faire
        env:
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
          VITE_WS_BASE: ${{ vars.VITE_WS_BASE }}
        run: bun install --frozen-lockfile && bun run build
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web/faire
          wranglerVersion: "4.123.0"
          command: pages deploy dist --project-name=go-single-web-faire --branch=main

  deploy-website:
    needs: configuration
    if: needs.configuration.outputs.cloudflare_configured == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Build website
        working-directory: website
        run: bun install --frozen-lockfile && bun run build
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: website
          wranglerVersion: "4.123.0"
          command: pages deploy build --project-name=go-single-website --branch=main

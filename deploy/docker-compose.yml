# 固定 project 名，确保从仓库根或 deploy/ 启动时复用同一组资源。
name: deploy

services:
  mysql:
    image: mysql:8.4.6@sha256:869218921e61d6c3c89820955d63cca42971f0e3e6c1e2792247bbd944ebc6e9
    container_name: go_single_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-go_shop}
      MYSQL_USER: ${MYSQL_USER:-shop}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-shop123}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4.5-alpine@sha256:bb186d083732f669da90be8b0f975a37812b15e913465bb14d845db72a4e3e08
    container_name: go_single_redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    # AOF everysec 为主（约 1 秒 RPO），RDB 为恢复兜底；集成测试需 21 个逻辑库。
    command:
      - redis-server
      - --databases
      - "21"
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --save
      - "3600"
      - "1"
      - "300"
      - "100"
      - "60"
      - "10000"
      - --requirepass
      - "${REDIS_PASSWORD:-}"
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$$REDIS_PASSWORD\" ]; then redis-cli --pass \"$$REDIS_PASSWORD\" --no-auth-warning ping; else redis-cli ping; fi"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13.7-management@sha256:e582c0bc7766f3342496d8485efb5a1df782b5ce3886ad017e2eaae442311f69
    container_name: go_single_rabbitmq
    hostname: go-single-rabbitmq
    restart: unless-stopped
    environment:
      # 固定节点名，确保容器重建后继续读取同一 Mnesia 数据目录。
      RABBITMQ_NODENAME: rabbit@go-single-rabbitmq
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: go_single_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "127.0.0.1:19000:9000"
      - "127.0.0.1:19001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  # 前端本地部署（T26 + T28）：托管 web/faire 构建产物 + /api、/ws 反代后端（同源路径）。
  # SSL 终止：443 承载全部流量（自签证书 ./nginx/gen-certs.sh 生成），80 仅 301 跳转 HTTPS。
  # 不含前端构建——宿主先 bun build（web/faire），dist 以只读挂载进容器。
  nginx:
    image: nginx:1.27.5-alpine
    container_name: go_single_nginx
    restart: unless-stopped
    ports:
      - "8081:80"
      - "8443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ../web/faire/dist:/usr/share/nginx/html:ro
    extra_hosts:
      # 后端以宿主机进程运行，容器内经该主机名访问宿主 :8080（与 prometheus 同法）。
      - "host.docker.internal:host-gateway"
    networks:
      default:
        # 与 configs/config.yaml 的 server.trusted_proxies 对齐，避免信任整个容器网段。
        ipv4_address: 172.30.0.10
    healthcheck:
      # 经 HTTPS /api 反代探活（--no-check-certificate：自签证书）：后端宕机时 nginx 回 502 → unhealthy
      # （验证 SSL 终止 + 反代联通，而非仅静态文件）。
      test: ["CMD", "wget", "-q", "--no-check-certificate", "-O", "/dev/null", "https://127.0.0.1/api/products"]
      interval: 10s
      timeout: 3s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: go_single_prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      # 后端以宿主机进程运行，容器内经该主机名访问宿主 :8080。
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/healthy"]
      interval: 5s
      timeout: 3s
      retries: 20

  grafana:
    image: grafana/grafana:11.4.0
    container_name: go_single_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  loki:
    image: grafana/loki:3.4.2
    container_name: go_single_loki
    restart: unless-stopped
    command:
      - -config.file=/etc/loki/local-config.yaml
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./monitoring/loki/config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3100/ready"]
      interval: 5s
      timeout: 3s
      retries: 20

  promtail:
    image: grafana/promtail:3.4.2
    container_name: go_single_promtail
    restart: unless-stopped
    command:
      - -config.file=/etc/promtail/config.yml
    volumes:
      - ./monitoring/promtail/config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # 宿主后端进程日志（go run ./cmd/server → ./logs/app.log）。
      - ../logs:/var/log/go-single:ro
      - promtail_data:/tmp/promtail
    depends_on:
      loki:
        condition: service_healthy

volumes:
  mysql_data:
  redis_data:
    name: go_single_redis_data
  rabbitmq_data:
    name: go_single_rabbitmq_data
  minio_data:
  prometheus_data:
  grafana_data:
  loki_data:
  promtail_data:

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24

# 本地 Nginx 部署（T26 部署双路径·同源路径）：
#   托管选定主题的构建产物 web/<theme>/dist（compose 挂载为 /usr/share/nginx/html）
#   + location /api 反代后端 :8080 + try_files SPA fallback（路由刷新不 404）。
# 后端以宿主机进程运行（go run ./cmd/server），容器内经 host.docker.internal 访问。
upstream go_single_backend {
    server host.docker.internal:8080;
    # 第二实例示例（后端多实例负载均衡）：
    # server host.docker.internal:8081;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 安全头（DESIGN「安全设计 → HTTPS 与安全头」）：演示路径未接 SSL，
    # 安全头必须齐全。CSP 允许同源脚本/样式 + MinIO 图片直连 + WS。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http://127.0.0.1:19000 https:; font-src 'self' data:; connect-src 'self' ws: wss: http://127.0.0.1:19000" always;

    # 带内容 hash 的静态资源长缓存（Vite 产物：/assets/*-hash.js/css）。
    # 注意：本块含 add_header，不继承 server 级安全头，需重复声明。
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http://127.0.0.1:19000 https:; font-src 'self' data:; connect-src 'self' ws: wss: http://127.0.0.1:19000" always;
    }

    # /api 反代：同源部署下浏览器只见前端域名，后端不直接暴露。
    location /api {
        proxy_pass http://go_single_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket 实时通道（T18）：需携带 Upgrade 头并放宽读超时（心跳保活）。
    location /ws {
        proxy_pass http://go_single_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    # SPA fallback：不存在的文件/目录路径统一回落到 index.html，交给前端路由。
    location / {
        try_files $uri $uri/ /index.html;
    }
}

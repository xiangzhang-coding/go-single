# 本地 Nginx 部署（T26 部署双路径·同源路径）：
#   托管选定主题的构建产物 web/<theme>/dist（compose 挂载为 /usr/share/nginx/html）
#   + location /api 反代后端 :8080 + try_files SPA fallback（路由刷新不 404）。
# 后端以宿主机进程运行（go run ./cmd/server），容器内经 host.docker.internal 访问。
upstream go_single_backend {
    server host.docker.internal:8080;
    # 第二实例示例（后端多实例负载均衡）：
    # server host.docker.internal:8081;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 带内容 hash 的静态资源长缓存（Vite 产物：/assets/*-hash.js/css）。
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # /api 反代：同源部署下浏览器只见前端域名，后端不直接暴露。
    location /api {
        proxy_pass http://go_single_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket 实时通道（T18）：需携带 Upgrade 头并放宽读超时（心跳保活）。
    location /ws {
        proxy_pass http://go_single_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 90s;
    }

    # SPA fallback：不存在的文件/目录路径统一回落到 index.html，交给前端路由。
    location / {
        try_files $uri $uri/ /index.html;
    }
}

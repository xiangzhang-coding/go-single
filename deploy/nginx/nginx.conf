# 本地 Nginx 部署（T26 部署双路径·同源路径 + T28 部署收尾·SSL 终止）：
#   SSL 终止：443 承载全部流量（托管选定主题的构建产物 web/<theme>/dist
#   + location /api、/ws 反代后端 :8080 + try_files SPA fallback），80 仅 301 跳转 HTTPS。
#   自签证书由 deploy/nginx/gen-certs.sh 生成（certs/ 不入库），演示用 curl -k 或浏览器信任提示。
# 后端以宿主机进程运行（go run ./cmd/server），容器内经 host.docker.internal 访问。
# 访问日志只记录路径，不记录 query 或请求头，避免凭据进入 Nginx/Docker 日志。
log_format safe '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
access_log /var/log/nginx/access.log safe;

upstream go_single_backend {
    server host.docker.internal:8080;
    # 第二实例示例（后端多实例负载均衡，默认 round-robin 轮询）：
    # server host.docker.internal:8081;
}

# 80 → 443：本地演示先从 301 跳转看起；生产同构（80 一律收敛 HTTPS）。
# $https_redirect_port 由独立环境配置提供：本地为 :8443，生产标准 443 为空。
server {
    listen 80;
    server_name _;

    # 旧客户端即使仍把 token 放进 query，也不把 query 回显进 Location。
    location = /ws {
        return 301 https://$host$https_redirect_port$uri;
    }
    return 301 https://$host$https_redirect_port$request_uri;
}

server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate     /etc/nginx/certs/go-single.crt;
    ssl_certificate_key /etc/nginx/certs/go-single.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;
    # 普通 API 与 Go 的 JSON 解析前硬上限一致；上传入口在精确 location 中单独放宽。
    client_max_body_size 64k;

    # 安全头（DESIGN「安全设计 → HTTPS 与安全头」）：SSL 终止 + X-Content-Type-Options /
    # X-Frame-Options / CSP + HSTS。私有媒体统一经同源 /api 鉴权代理，不放行 MinIO 直连。
    # HSTS 对浏览器仅对域名生效（IP/localhost 被忽略），本地演示无副作用。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:" always;

    # 带内容 hash 的静态资源长缓存（Vite 产物：/assets/*-hash.js/css）。
    # 注意：本块含 add_header，不继承 server 级安全头，需重复声明。
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:" always;
    }

    # 上传入口：20 MiB 文件消息另预留 1 MiB multipart 开销；Go 同样先以 21 MiB
    # 限制请求体，再按 kind 执行图片 5 MiB / 普通文件 20 MiB 业务上限。
    location = /api/files {
        client_max_body_size 21m;
        proxy_send_timeout 140s;
        proxy_read_timeout 140s;
        proxy_pass http://go_single_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /api 反代：同源部署下浏览器只见前端域名，后端不直接暴露。
    location /api {
        proxy_pass http://go_single_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 单层代理直接覆盖，不能保留客户端伪造的 X-Forwarded-For 前缀。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket 实时通道（T18）：需携带 Upgrade 头并放宽读超时（心跳保活）。
    location /ws {
        # query JWT 已停用；在进入 upstream 前拒绝旧格式，避免错误日志回显原始 URI。
        if ($arg_token != "") { return 400; }
        proxy_pass http://go_single_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    # SPA fallback：不存在的文件/目录路径统一回落到 index.html，交给前端路由。
    location / {
        try_files $uri $uri/ /index.html;
    }
}

server:
  port: 8080
  mode: debug

log:
  level: info

mysql:
  host: 127.0.0.1
  port: 3306
  user: shop
  password: shop123
  database: go_shop

redis:
  addr: 127.0.0.1:6379
  password: ""
  db: 0

mq:
  url: amqp://guest:guest@127.0.0.1:5672/

minio:
  endpoint: 127.0.0.1:19000
  access_key: minioadmin
  secret_key: minioadmin
  bucket: go-shop
  use_ssl: false
  public_url: http://127.0.0.1:19000

migrations:
  path: ./migrations

auth:
  secret: dev-secret-change-me
  ttl: 2h

snowflake:
  # 多实例部署时每个实例必须配置不同的 worker_id（0-1023）。
  worker_id: 1

flashsale:
  # 抢购接口限流：全局令牌桶（x/time/rate，进程内单实例）。
  qps: 50
  burst: 100
  # 按用户限流：Redis 固定窗口计数（INCR+TTL，跨请求状态）。
  per_user_max: 5
  per_user_window: 1s

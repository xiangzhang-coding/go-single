server:
  port: 8080
  mode: debug
  # 单请求全链路超时（HTTP → service → 存储/MQ）：依赖超时快速失败（504）。
  request_timeout: 5s
  # 可信反代 IP 白名单（gin TrustedProxies）：Nginx 容器经 host-gateway 转发，
  # 命中后采信 X-Forwarded-For/X-Real-IP 还原客户端 IP（日志/指标）；
  # 云端部署改为反代出口 IP，直连部署留空（不采信代理头）。
  trusted_proxies:
    - 127.0.0.1
    - ::1
    # deploy compose 为 Nginx 固定的地址；生产应改为实际反代出口 IP。
    - 172.30.0.10

log:
  level: info
  # 日志文件镜像（promtail 采集进 Loki）；留空 = 仅 stdout。
  file: ./logs/app.log

mysql:
  host: 127.0.0.1
  port: 3306
  user: shop
  password: shop123
  database: go_shop

redis:
  addr: 127.0.0.1:6379
  password: ""
  db: 0

mq:
  url: amqp://guest:guest@127.0.0.1:5672/
  # 消费者熔断（gobreaker）：连续失败打开 → 快速失败，冷却后半开探活，恢复闭合。
  circuit:
    max_consecutive_failures: 3
    interval: 30s
    timeout: 10s

minio:
  endpoint: 127.0.0.1:19000
  access_key: minioadmin
  secret_key: minioadmin
  bucket: go-shop
  use_ssl: false

migrations:
  path: ./migrations

auth:
  secret: dev-secret-change-me
  ttl: 2h

snowflake:
  # 多实例部署时每个实例必须配置不同的 worker_id（0-1023）。
  worker_id: 1

flashsale:
  # 抢购接口限流：全局令牌桶（x/time/rate，进程内单实例）。
  qps: 50
  burst: 100
  # 按用户限流：Redis 固定窗口计数（INCR+TTL，跨请求状态）。
  per_user_max: 5
  per_user_window: 1s

retry:
  # 幂等操作有限重试（下单/支付回调/秒杀消息发布；非幂等操作不重试）。
  attempts: 3
  initial_backoff: 100ms
  max_backoff: 1s

ws:
  # WebSocket 长连接心跳保活：Ping 间隔（pong_wait = 2× 间隔）与单条写超时。
  heartbeat_interval: 30s
  write_wait: 10s
  # 单进程连接配额：总数 / 单用户 / 单来源 IP；升级中的握手同样占用配额。
  max_connections: 1000
  max_connections_per_user: 5
  max_connections_per_ip: 50
  # 握手 Origin 白名单；空 = 允许所有（演示取舍，生产配置前端域名）。
  allow_origins: []

cors:
  # HTTP 接口允许跨源访问的前端 Origin 白名单（云端独立部署场景）；
  # 空 = 允许所有（演示取舍，生产配置前端域名，如 https://shop.example.com）。
  allow_origins: []
